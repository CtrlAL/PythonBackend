apiVersion: apps/v1
kind: Deployment
metadata:
  name: scylla
  namespace: fastapi-url
spec:
  replicas: 1
  selector:
    matchLabels: {app: scylla}
  template:
    metadata:
      labels: {app: scylla}
    spec:
      containers:
        - name: scylla
          image: scylladb/scylla:5.4
          args: ["--smp", "1", "--memory", "1G", "--overprovisioned", "1"]
          ports:
            - {containerPort: 9042}
          readinessProbe:
            exec:
              command: ["cqlsh", "-e", "SELECT now() FROM system.local"]
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: scylla
  namespace: fastapi-url
spec:
  selector: {app: scylla}
  ports:
    - {port: 9042, targetPort: 9042}
