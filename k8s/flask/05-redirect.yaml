apiVersion: apps/v1
kind: Deployment
metadata:
  name: redirect
  namespace: flask-url
spec:
  replicas: 1
  selector:
    matchLabels: {app: redirect}
  template:
    metadata:
      labels: {app: redirect}
    spec:
      containers:
        - name: redirect
          image: flask-redirect:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: flask-config}
          ports:
            - {containerPort: 5000}
          readinessProbe:
            httpGet: {path: /healthz, port: 5000}
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redirect
  namespace: flask-url
spec:
  type: NodePort
  selector: {app: redirect}
  ports:
    - {port: 5000, targetPort: 5000, nodePort: 30080}
