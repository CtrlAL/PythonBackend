apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: flask-url
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - {name: POSTGRES_USER, value: "shortener"}
            - {name: POSTGRES_PASSWORD, value: "shortener"}
            - {name: POSTGRES_DB, value: "shortener"}
          ports:
            - {containerPort: 5432}
          volumeMounts:
            - {name: pgdata, mountPath: /var/lib/postgresql/data}
      volumes:
        - name: pgdata
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: flask-url
spec:
  selector: {app: postgres}
  ports:
    - {port: 5432, targetPort: 5432}
