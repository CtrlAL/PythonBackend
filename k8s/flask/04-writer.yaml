apiVersion: apps/v1
kind: Deployment
metadata:
  name: writer
  namespace: flask-url
spec:
  replicas: 1
  selector:
    matchLabels: {app: writer}
  template:
    metadata:
      labels: {app: writer}
    spec:
      containers:
        - name: writer
          image: flask-writer:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: flask-config}
          ports:
            - {containerPort: 5000}
          readinessProbe:
            httpGet: {path: /healthz, port: 5000}
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: writer
  namespace: flask-url
spec:
  selector: {app: writer}
  ports:
    - {port: 5000, targetPort: 5000}
