apiVersion: apps/v1
kind: Deployment
metadata:
  name: redirect
  namespace: drf-url
spec:
  replicas: 1
  selector:
    matchLabels: {app: redirect}
  template:
    metadata:
      labels: {app: redirect}
    spec:
      containers:
        - name: redirect
          image: drf-redirect:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: drf-config}
          ports:
            - {containerPort: 8000}
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: redirect
  namespace: drf-url
spec:
  type: NodePort
  selector: {app: redirect}
  ports:
    - {port: 8000, targetPort: 8000, nodePort: 30081}
