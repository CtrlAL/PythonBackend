apiVersion: apps/v1
kind: Deployment
metadata:
  name: writer
  namespace: drf-url
spec:
  replicas: 1
  selector:
    matchLabels: {app: writer}
  template:
    metadata:
      labels: {app: writer}
    spec:
      containers:
        - name: writer
          image: drf-writer:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: drf-config}
          ports:
            - {containerPort: 8000}
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: writer
  namespace: drf-url
spec:
  selector: {app: writer}
  ports:
    - {port: 8000, targetPort: 8000}
