[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "urlshort-drf"
version = "0.1.0"
description = "URL shortener DRF Clean Architecture implementation"
requires-python = ">=3.10"
dependencies = [
    "django>=4.2",
    "djangorestframework>=3.14",
    "cassandra-driver>=3.28",
    "redis>=5.0",
    "pydantic>=2.0",
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["shared*", "writer_service*", "redirect_service*", "seed*"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = true
