[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "urlshort-fastapi"
version = "0.1.0"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn==0.30.1",
    "cassandra-driver==3.29.1",
    "redis==5.0.4",
    "pydantic==2.7.1",
    "dishka>=1.4.0",
    "pytest>=8.2.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = true
